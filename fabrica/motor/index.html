<!doctype html><html><head><meta charset="utf-8"><title>Historia</title>
<style>
@font-face{font-family:"Inter";src:url("fonts/Inter.ttf") format("truetype");font-weight:100 900}
@font-face{font-family:"Cormorant";src:url("fonts/Cormorant.ttf") format("truetype");font-weight:300 700}
@font-face{font-family:"Mono";src:url("fonts/JetBrainsMono.ttf") format("truetype");font-weight:100 900}
html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import * as L from './lib.js';
import story from './story.js';
const IMG = {};
await Promise.all((story.assets || []).map(src => new Promise(res => { const im = new Image(); im.onload = () => { IMG[src] = im; res(); }; im.onerror = () => res(); im.src = src; })));
L.run(S => story(L, S), IMG);
</script></body></html>
